spring:
  datasource:
    url: jdbc:h2:mem:productDB   # in-memory database named productDB
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true              # access H2 console at /h2-console
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop      # drops and recreates schema on every start
    show-sql: true               # logs all generated SQL to console
    properties:
      hibernate:
        format_sql: true         # pretty-prints the SQL